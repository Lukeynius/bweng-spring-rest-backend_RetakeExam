# ===== Databank (MariaDB) =====
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spring}
spring.datasource.username=${DB_USER:springuser}
spring.datasource.password=${DB_PASSWORD:springpw}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate (ORM) =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== MinIO (Object Storage) =====
minio.host=${BUCKET_HOST:localhost}
minio.port=${BUCKET_PORT:9000}
minio.access-key=${BUCKET_ACCESS_KEY:minioadmin}
minio.secret-key=${BUCKET_ACCESS_SECRET:minioadminpw}
minio.bucket-name=${BUCKET_NAME:files}

# ===== Documentation =====
springdoc.api-docs.path=/api
springdoc.swagger-ui.path=/swagger.html

# ===== JWT (JSON Web Token) =====
jwt.secret=${JWT_SECRET:mySuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm12345}
jwt.expiration=86400000

# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB